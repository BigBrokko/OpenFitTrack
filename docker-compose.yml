services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # The database lives on the volume inside the container.
      DATABASE_URL: sqlite:////data/openfittrack.db
    volumes:
      - oft-data:/data
      - ./data:/nevo:ro  # optional: your NEVO download, for scripts/import_nevo.py
    restart: unless-stopped

volumes:
  oft-data:
